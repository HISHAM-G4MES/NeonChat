<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a0a12">
<title>Neon Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<style>
  :root{
    --accent:#00f0ff; --bg:#0a0a12; --panel:#12121d; --panel2:#1a1a2b; --text:#eaeaf5; --muted:#8a8aa8;
    --cyan:#00f0ff; --pink:#ff3ec8; --green:#39ff88; --yellow:#ffe14d; --purple:#b26bff; --blue:#4d8dff; --red:#ff4d6d;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;user-select:none}
  body{background:radial-gradient(circle at 15% 0%,#1f0b30 0,transparent 45%),radial-gradient(circle at 90% 100%,#06263a 0,transparent 50%),var(--bg)}
  button,input,textarea,select{font:inherit;color:inherit}
  .hidden{display:none!important}

  #app{display:flex;flex-direction:column;height:min(820px,calc(100dvh - 24px));max-width:440px;margin:12px auto;position:relative;background-color:var(--bg);background-image:linear-gradient(var(--bg),var(--bg)),linear-gradient(120deg,var(--cyan),var(--pink),var(--purple),var(--cyan));background-origin:border-box;background-clip:padding-box,border-box;background-size:auto,300% 300%;animation:sheen 8s linear infinite;border:1px solid transparent;border-radius:28px;overflow:hidden;box-shadow:0 0 40px rgba(0,240,255,.2)}
  @media (min-width:600px){#app{max-width:560px;height:min(900px,calc(100dvh - 40px));margin:20px auto}}
  @media (min-width:1000px){#app{max-width:680px}}
  @media (min-width:1400px){#app{max-width:760px}}
  @media (max-width:500px){#app{height:100dvh;max-width:100%;margin:0;border-radius:0;border:none;box-shadow:none}}
  @media (orientation:landscape) and (max-height:500px){#app{height:100dvh;max-width:100%;border-radius:0;margin:0}}

  #topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px));background:rgba(18,18,29,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #222238}
  #topbar h1{font-size:clamp(18px,2vw + 8px,24px);color:var(--accent);animation:flicker 6s infinite}
  main{flex:1;position:relative;overflow:hidden}
  .view{position:absolute;inset:0;overflow-y:auto;padding:clamp(10px,2vw,20px);padding-bottom:20px}

  .btn{border:1.5px solid currentColor;border-radius:12px;padding:10px 14px;cursor:pointer;background:transparent;transition:.2s;font-weight:600;position:relative;overflow:hidden}
  .btn:hover{box-shadow:0 0 14px currentColor}
  .btn:active{transform:scale(.95)}
  .btn.solid{color:#0a0a12;border:none}
  .icon{width:clamp(36px,4vw,46px);height:clamp(36px,4vw,46px);border-radius:50%;border:1.5px solid currentColor;background:transparent;cursor:pointer;display:grid;place-items:center;font-size:18px;transition:.2s;position:relative;overflow:hidden;flex-shrink:0}
  .icon:hover{box-shadow:0 0 16px currentColor,inset 0 0 8px currentColor;transform:translateY(-1px)}
  .icon:active{transform:scale(.9)}
  .c-cyan{color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.35)}
  .c-pink{color:var(--pink);box-shadow:0 0 8px rgba(255,62,200,.35)}
  .c-green{color:var(--green);box-shadow:0 0 8px rgba(57,255,136,.35)}
  .c-yellow{color:var(--yellow);box-shadow:0 0 8px rgba(255,225,77,.35)}
  .c-purple{color:var(--purple);box-shadow:0 0 8px rgba(178,107,255,.35)}
  .c-blue{color:var(--blue);box-shadow:0 0 8px rgba(77,141,255,.35)}
  .c-red{color:var(--red);box-shadow:0 0 8px rgba(255,77,109,.35)}
  .bg-cyan{background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
  .bg-red{background:var(--red)}
  .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.35;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}

  .chat-item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid #232340;border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;animation:pop-in .3s ease-out both}
  .chat-item:hover{border-color:var(--accent);box-shadow:0 0 16px rgba(0,240,255,.25);transform:translateX(-2px)}
  .chat-item:active{background:var(--panel2)}
  .chat-item.pinned{border-color:rgba(178,107,255,.45)}
  .avatar{width:clamp(40px,5vw,56px);height:clamp(40px,5vw,56px);border-radius:50%;background:var(--panel2) center/cover no-repeat;border:2px solid var(--accent);flex-shrink:0;display:grid;place-items:center;font-size:22px;overflow:hidden;animation:glow 2.5s infinite}
  .chat-info{flex:1;min-width:0}
  .chat-info b{display:block;font-size:clamp(14px,1.2vw + 10px,17px)}
  .chat-info small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(12px,1vw + 8px,15px)}
  .ts{font-size:11px;color:var(--muted);align-self:flex-start}
  .empty{text-align:center;color:var(--muted);margin-top:60px}

  #view-chat{display:flex;flex-direction:column;padding:0}
  #chatHead{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(18,18,29,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #222238;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  #backBtn{width:36px;height:36px;font-size:16px}
  #chatHead .name{flex:1;font-weight:700;color:var(--pink);text-shadow:0 0 10px var(--pink),0 0 20px var(--pink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chatHead .avatar{width:34px;height:34px;font-size:16px;animation:none;cursor:pointer}
  #messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:2px;background:radial-gradient(circle at 20% 10%,rgba(255,62,200,.05),transparent 40%),radial-gradient(circle at 80% 90%,rgba(0,240,255,.05),transparent 40%)}
  .row{display:flex;align-items:flex-start;animation:pop-in .25s ease-out;contain:layout style}
  .row.mine{justify-content:flex-start}
  .row.theirs{justify-content:flex-end}
  [dir=ltr] .row.mine{justify-content:flex-end}
  [dir=ltr] .row.theirs{justify-content:flex-start}
  .bubble{display:inline-block;width:fit-content;max-width:72%;padding:4px 9px 3px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere;cursor:pointer;position:relative;font-size:clamp(13px,1vw + 11px,17px);line-height:1.3;transition:transform .15s,filter .2s;color:var(--text)}
  @media (min-width:600px){.bubble{max-width:65%}}
  .bubble:hover{filter:brightness(1.08)}
  .bubble.pressing{transform:scale(.97)}
  .mine .bubble{background:rgba(0,240,255,.12);border:1px solid rgba(0,240,255,.35);border-bottom-right-radius:6px}
  [dir=ltr] .mine .bubble{border-bottom-right-radius:16px;border-bottom-left-radius:6px}
  .theirs .bubble{background:var(--panel2);border:1px solid rgba(255,62,200,.3);border-bottom-left-radius:6px}
  [dir=ltr] .theirs .bubble{border-bottom-left-radius:16px;border-bottom-right-radius:6px}
  .meta{display:inline-block;font-size:clamp(9px,.6vw + 7px,11px);color:var(--muted);margin-inline-start:6px;line-height:1}
  .quote{border-inline-start:3px solid var(--green);padding:4px 8px;margin-bottom:6px;background:rgba(57,255,136,.08);border-radius:8px;font-size:12px;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  img.media{max-width:min(240px,68vw);max-height:320px;border-radius:12px;display:block;cursor:zoom-in;min-width:60px;min-height:60px;background:var(--panel)}
  audio{max-width:240px;display:block}
  a.file{color:var(--yellow);text-decoration:none;font-weight:600;display:block}
  a.file small{color:var(--muted);font-weight:400;margin-inline-start:6px}

  .vp{width:min(260px,68vw);border-radius:12px;overflow:hidden;background:#000;border:1px solid rgba(0,240,255,.25)}
  .vp video{width:100%;display:block;max-height:280px;background:#000;cursor:pointer}
  .vp-bar{display:flex;align-items:center;gap:4px;padding:6px;background:var(--panel);flex-wrap:wrap}
  .vp-bar button{background:var(--panel2);border:1px solid currentColor;border-radius:8px;padding:3px 7px;cursor:pointer;font-size:12px;transition:.2s;min-width:30px}
  .vp-bar button:hover{box-shadow:0 0 8px currentColor}
  .vp-bar button:active{transform:scale(.92)}
  .vp-seek{flex:1 1 60px;min-width:60px;accent-color:var(--pink)}
  .vp-time{font-size:10px;color:var(--muted);white-space:nowrap}

  #replyBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);border-top:1px solid #222238;font-size:13px}
  #replyBar .txt{flex:1;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #composer{display:flex;align-items:center;gap:6px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid #222238}
  #composer input{flex:1;min-width:0;background:var(--panel2);border:1px solid #2c2c48;border-radius:22px;padding:11px 14px;outline:none;user-select:text;font-size:16px}
  #composer input:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,.3)}
  #plusBtn{transition:transform .25s,box-shadow .2s}
  #plusBtn.open{transform:rotate(45deg)}
  #plusSheet{position:absolute;bottom:72px;left:10px;right:10px;background:var(--panel);border:1px solid var(--accent);border-radius:18px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;box-shadow:0 0 18px rgba(0,240,255,.3);z-index:20;animation:pop-in .2s ease-out}
  #plusSheet button{background:var(--panel2);border:1.5px solid currentColor;border-radius:12px;padding:12px;cursor:pointer;font-weight:600;transition:.2s;position:relative;overflow:hidden}
  #plusSheet button:hover{box-shadow:0 0 14px currentColor;transform:translateY(-2px)}
  #plusSheet button:active{transform:scale(.95)}
  #stopBtn{animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.5}}

  .card{background:var(--panel);border:1px solid #232340;border-radius:16px;padding:clamp(12px,2vw,20px);margin-bottom:14px;transition:box-shadow .3s}
  .card:hover{box-shadow:0 0 20px rgba(255,62,200,.18)}
  .card h3{margin-bottom:12px;font-size:15px}
  .row-set{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222238;gap:10px}
  .row-set:last-child{border-bottom:none}
  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .sw{width:36px;height:36px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s}
  .sw:hover{transform:scale(1.1)}
  .sw.on{border-color:#fff;transform:scale(1.1)}
  .switch{position:relative;width:48px;height:26px;background:#2a2a40;border-radius:20px;cursor:pointer;transition:.2s;border:1px solid #3a3a58;flex-shrink:0}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#aaa;transition:.2s}
  .switch.on{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(57,255,136,.5);animation:glow 2s infinite}
  .switch.on::after{left:24px;background:#0a0a12}
  .seg{display:flex;gap:6px}
  .seg button{padding:7px 12px;border-radius:10px;border:1.5px solid #3a3a58;background:var(--panel2);cursor:pointer;transition:.2s;color:var(--muted)}
  .seg button.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(0,240,255,.4)}
  .profile-head{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px}
  .avatar.big{width:120px;height:120px;font-size:50px;cursor:pointer}
  input.text,textarea.text{width:100%;background:var(--panel2);border:1px solid #2c2c48;border-radius:12px;padding:11px 14px;outline:none;user-select:text;font-size:16px;font-family:inherit;resize:vertical}
  input.text:focus,textarea.text:focus{border-color:var(--yellow);box-shadow:0 0 8px rgba(255,225,77,.3)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .full{width:100%}

  #tabs{display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid #222238;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  #tabs button{flex:1;background:none;border:none;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:clamp(11px,1vw + 8px,14px);transition:.2s;position:relative;overflow:hidden}
  #tabs button:hover{color:#fff}
  #tabs button span.i{font-size:clamp(18px,1.6vw + 12px,24px)}
  #tabs button.on{color:var(--accent);text-shadow:0 0 8px var(--accent)}
  #tabs button.on span.i{animation:pop-in .35s}

  #menuBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
  #menu{position:fixed;z-index:51;background:var(--panel);border:1px solid var(--accent);border-radius:16px;box-shadow:0 0 20px rgba(0,240,255,.35);padding:6px;min-width:200px;display:none;animation:pop-in .15s ease-out}
  #menu button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;background:none;border:none;border-radius:10px;cursor:pointer;font-size:15px;text-align:start}
  #menu button:active{background:var(--panel2)}
  #menu button i{font-style:normal;width:22px;text-align:center}

  #modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none}
  #modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:91;width:min(92vw,380px);max-height:80dvh;overflow:auto;background:var(--panel);border:1px solid var(--accent);border-radius:18px;padding:18px;box-shadow:0 0 24px rgba(0,240,255,.3);display:none;animation:pop-in .2s ease-out}
  #modalBg.show,#modal.show{display:block}
  #modal h3{color:var(--accent);margin-bottom:12px;text-shadow:0 0 8px var(--accent)}
  #mBody{display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--text)}
  #mBody .muted{color:var(--muted);font-size:13px}
  #mBody .pick{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid #2c2c48;border-radius:12px;padding:10px;cursor:pointer;text-align:start;transition:.2s}
  #mBody .pick:hover{border-color:var(--purple);box-shadow:0 0 12px rgba(178,107,255,.4)}
  #mActions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  #mActions button{padding:9px 16px;border-radius:12px;border:1.5px solid currentColor;background:var(--panel2);cursor:pointer;font-weight:600;transition:.2s}
  #mActions button:hover{box-shadow:0 0 12px currentColor}
  .info-head{display:flex;flex-direction:column;align-items:center;gap:10px}
  .info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222238;font-size:14px}

  #viewer{position:fixed;inset:0;background:rgba(5,5,10,.94);z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
  #viewer.show{display:flex;animation:pop-in .2s ease-out}
  #viewer img{max-width:96vw;max-height:78vh;border-radius:12px;box-shadow:0 0 30px rgba(0,240,255,.3);transition:transform .25s;cursor:zoom-in;object-fit:contain}
  #viewer img.zoomed{transform:scale(1.9);cursor:zoom-out}
  #viewerBar{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:12px;display:flex;gap:8px}
  #viewerActions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #viewerActions a{border:1.5px solid currentColor;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--panel);text-decoration:none;font-weight:600;transition:.2s}
  #viewerActions a:hover{box-shadow:0 0 14px currentColor}

  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:20px;box-shadow:0 0 18px rgba(57,255,136,.4);opacity:0;transition:.3s;z-index:100;pointer-events:none;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @keyframes pop-in{from{opacity:0;transform:translateY(8px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes flicker{0%,18%,22%,80%,100%{text-shadow:0 0 6px var(--accent),0 0 16px var(--accent),0 0 32px var(--accent)}20%,21%{text-shadow:0 0 2px var(--accent)}}
  @keyframes sheen{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  @keyframes glow{0%,100%{box-shadow:0 0 8px var(--accent)}50%{box-shadow:0 0 22px var(--accent)}}
  @keyframes rip{to{transform:scale(2.5);opacity:0}}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px;box-shadow:0 0 6px var(--accent)}
  @media (max-width:360px){.icon{width:34px;height:34px;font-size:15px}#composer{gap:4px;padding:8px}#composer input{padding:9px 12px}}
  @media (hover:none){.icon:hover,.chat-item:hover{transform:none}}
  svg.ico{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px currentColor);flex-shrink:0}
  #tabs svg.ico{width:clamp(18px,1.6vw + 12px,24px);height:clamp(18px,1.6vw + 12px,24px)}
  #menu svg.ico{width:18px;height:18px}
  .stk{width:96px;height:96px;filter:drop-shadow(0 0 6px rgba(255,255,255,.15))}
  .stk svg{width:100%;height:100%;filter:drop-shadow(0 0 5px currentColor)}
  .bubble:has(.stk){background:transparent!important;border:none!important;box-shadow:none!important;padding:0}
  #stickerPanel{position:absolute;bottom:72px;left:10px;right:10px;max-height:42vh;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--pink);border-radius:18px;padding:10px;box-shadow:0 0 18px rgba(255,62,200,.3);z-index:20;animation:pop-in .2s ease-out}
  .stk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
  .stk-h{font-size:12px;color:var(--muted);margin:8px 2px 6px;letter-spacing:.5px;text-transform:uppercase}
  .stk-grid button{background:var(--panel2);border:1px solid #2c2c48;border-radius:10px;padding:4px;cursor:pointer;transition:.2s;aspect-ratio:1}
  .stk-grid button:hover{transform:translateY(-2px) scale(1.05);border-color:var(--pink);box-shadow:0 0 12px rgba(255,62,200,.4)}
  .stk-grid svg{width:100%;height:100%}
  #pendBar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);border-top:1px solid #222238;font-size:13px}
  #pendBar .pend-svg{width:40px;height:40px;flex-shrink:0}
  #pendBar .pend-svg svg{width:100%;height:100%}
  #pendBar span.lbl{flex:1;color:var(--pink)}
  .stk-sm{display:inline-block;width:1.6em;height:1.6em;vertical-align:middle;margin-inline-end:4px}
  .stk-sm svg{width:100%;height:100%}
  .react{display:inline-block;font-size:14px;margin-inline-start:4px}
  .lcard{display:block;margin-top:6px;padding:8px 10px;border-inline-start:3px solid var(--cyan);background:rgba(0,240,255,.06);border-radius:10px;color:var(--text);text-decoration:none}
  .lcard b{display:block;font-size:13px;color:var(--cyan)}
  .lcard small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
  .notif{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:95;width:min(92vw,360px);background:var(--panel);border:1px solid var(--pink);border-radius:16px;padding:10px 14px;box-shadow:0 0 18px rgba(255,62,200,.4);cursor:pointer;animation:pop-in .25s ease-out}
  .notif b{display:block;color:var(--pink);font-size:14px}
  .notif span{display:block;color:var(--text);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #composer input{padding:13px 16px;font-size:16px}
  #composer .icon{width:46px;height:46px}
  #sendBtn{width:50px;height:50px}
  #tabs button[data-tab="settings"]{display:none}
  [data-theme=light]{--bg:#f4f4fb;--panel:#ffffff;--panel2:#eef0f8;--text:#14142a;--muted:#6a6a88}
  [data-theme=light] body{background:var(--bg)}
  [data-theme=light] #app{background-color:var(--bg)}
  [data-theme=light] #topbar,[data-theme=light] #chatHead,[data-theme=light] #tabs,[data-theme=light] #composer,[data-theme=light] #pendBar,[data-theme=light] #replyBar{background:var(--panel)}
  [data-theme=light] #topbar h1{animation:none;text-shadow:none;color:#0a8fa0}
  [data-theme=light] #chatHead .name{color:#c2188f;text-shadow:none}
  [data-theme=light] #messages{background:var(--bg)}
  [data-theme=light] .mine .bubble{background:rgba(0,200,220,.18)}

  /* ---------- تخزين الملفات (IndexedDB) ---------- */
  const dbp = new Promise((res, rej) => {
    const r = indexedDB.open('neonchat', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('blobs');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  async function store(mode, fn){
    const db = await dbp;
    return new Promise((res, rej) => {
      const tr = db.transaction('blobs', mode);
      const req = fn(tr.objectStore('blobs'));
      tr.oncomplete = () => res(req ? req.result : undefined);
      tr.onerror = () => rej(tr.error);
    });
  }
  const putBlob = (id, b) => store('readwrite', s => s.put(b, id));
  const getBlob = id => store('readonly', s => s.get(id));
  const delBlob = id => store('readwrite', s => s.delete(id));
  const clearBlobs = () => store('readwrite', s => s.clear());
  const urlCache = {};
  async function urlFor(id){
    if(!urlCache[id]){
      const b = await getBlob(id);
      if(!b) return '';
      urlCache[id] = URL.createObjectURL(b);
    }
    return urlCache[id];
  }
  function dropAllUrls(){ Object.keys(urlCache).forEach(k => { URL.revokeObjectURL(urlCache[k]); delete urlCache[k]; }); }
  function refCount(id){
    let n = 0;
    state.chats.forEach(c => c.messages.forEach(m => { if(m.blobId === id) n++; }));
    return n;
  }
  async function dropBlobIfUnused(id){
    if(!id || refCount(id) > 0) return;
    if(urlCache[id]){ URL.revokeObjectURL(urlCache[id]); delete urlCache[id]; }
    try { await delBlob(id); } catch(e){}
  }

  /* ---------- الحالة ---------- */
  function defaults(){
    return {
      profile:{name:'', avatar:''},
      settings:{accent:'#00f0ff', botReply:true, sort:'new', lang:'en'},

        messages:[{id:uid(), from:'bot', type:'text', key:'welcome', ts:Date.now()}] }]
    };
  }
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch(e){ state = defaults(); }
  state.settings = Object.assign(defaults().settings, state.settings);
  if(!state.chats.some(c => c.id === 'ai')) state.chats.unshift({id:'ai', title:'Neon AI', avatar:'', pinned:true, created:Date.now(), updated:Date.now(), messages:[{id:uid(), from:'bot', type:'text', text:'Hi! I am Neon AI 🤖 The AI service is not connected yet, so my replies are trial replies for now.', ts:Date.now()}]});
  state.chats.forEach(c => { if(c.created === undefined) c.created = c.updated || Date.now(); if(c.pinned === undefined) c.pinned = false; });
  let currentChat = null, replyTarget = null, recorder = null, recChunks = [], currentView = 'chats';

  const lang = () => state.settings.lang === 'ar' ? 'ar' : 'en';
  function t(key, ...args){
    let s = (DICT[lang()][key] ?? DICT.en[key] ?? key);
    args.forEach(a => { s = s.replace(/%[sd]/, a); });
    return s;
  }

  const timeStr = ts => new Date(ts).toLocaleTimeString(lang() === 'ar' ? 'ar' : 'en', {hour:'2-digit', minute:'2-digit'});

    catch(e){ toast(t('storageFull')); }

  async function hydrate(){
    document.querySelectorAll('[data-blob]').forEach(async el => {

      if(!url) return;
      if(el.tagName === 'A') el.href = url;
      else if(el.classList.contains('vm')){ const a = el.querySelector('audio'); if(a && !a.src) a.src = url; }
      else if(el.classList.contains('vp')){
        const v = el.querySelector('video');
        if(v && !v.src) v.src = url;
      }
      else el.src = url;
    });
    document.querySelectorAll('.vm').forEach(vm => {
      const a = vm.querySelector('audio');
      if(!a || a._bound) return;
      a._bound = true;
      const bars = vm.querySelectorAll('.vm-wave i'), play = vm.querySelector('.vm-play');
      a.addEventListener('play', () => { play.textContent = '❚❚'; vm.classList.add('playing'); });
      a.addEventListener('pause', () => { play.textContent = '▶'; vm.classList.remove('playing'); });
      a.addEventListener('ended', () => { play.textContent = '▶'; vm.classList.remove('playing'); });
      a.addEventListener('timeupdate', () => { const f = a.duration ? a.currentTime / a.duration : 0; bars.forEach((b, i) => b.classList.toggle('on', i / bars.length < f)); });
    });
    document.querySelectorAll('.vp').forEach(vp => {
      const v = vp.querySelector('video');
      if(!v || v._bound) return;
      v._bound = true;
      const seek = vp.querySelector('.vp-seek'), time = vp.querySelector('.vp-time'), play = vp.querySelector('[data-vp="play"]');

      v.addEventListener('play', () => play.textContent = '❚❚');
      v.addEventListener('pause', () => play.textContent = '▶');
      v.addEventListener('ended', () => play.textContent = '▶');
    });
  }

  async function startRec(){
    if(recorder && recorder.state === 'recording'){ recorder.stop(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast(t('micUnsupported')); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recChunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = e => recChunks.push(e.data);
      recorder.onstop = () => {
        stream.getTracks().forEach(tr => tr.stop());
        $('#stopBtn').classList.add('hidden');
        const blob = new Blob(recChunks, {type: recorder.mimeType || 'audio/webm'});
        sendFile(new File([blob], 'voice.webm', {type: blob.type}));
      };
      recorder.start();
      $('#stopBtn').classList.remove('hidden');
      toast(t('recording'));
    }catch(err){ toast(t('micDenied')); }
  }

  function linkCard(m){
    if(m.type !== 'text') return '';
    const mt = textOf(m).match(/https?:\/\/[^\s]+/);
    if(!mt) return '';
    let host = mt[0];
    try { host = new URL(mt[0]).hostname; } catch(e){}
    return `<a class="lcard" href="${esc(mt[0])}" target="_blank" rel="noopener"><b>${esc(host)}</b><small>${esc(mt[0])}</small></a>`;
  }
  function compressImage(file){
    if(!file.type.startsWith('image/') || file.type === 'image/gif' || file.size < 400 * 1024) return Promise.resolve(file);
    return new Promise(resolve => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(b => resolve(b && b.size < file.size ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', {type:'image/jpeg'}) : file), 'image/jpeg', 0.82);
      };
      img.onerror = () => resolve(file);
      img.src = url;
    });
  }

  function exportChatPdf(chat){
    const rows = chat.messages.map(m => {

  let genCount = 0;
  for(let e = 0; e < 8 && genCount < 500; e++)
    for(let m = 0; m < 8 && genCount < 500; m++)
      for(let p = 0; p < 8 && genCount < 500; p++){
        const c = GEN_PAL[p];
        STICKERS['g' + genCount] = face(c, GEN_MOUTHS[m], GEN_EYES[e](c));
        genCount++;
      }
  Object.keys(STICKERS).forEach(k => { if(/^g\d+$/.test(k)) delete STICKERS[k]; });
  const GB = [
    c => `<circle cx="32" cy="32" r="26"/>`,

  ];
  const GA = [

    const k = (i * 37) % 1000;
    const b = k % 10, a = Math.floor(k / 10) % 10, o = Math.floor(k / 100) % 10;
    const c = GEN_PAL2[(i * 7) % 6];
    STICKERS['x' + i] = `<svg viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${GB[b](c)}${GA[a](c)}${GO[o](c)}</svg>`;
  }
  const STK_CATS = [['Faces',['smile','laugh','wink','cool','cry','sad','angry','love','sleep','sick','kiss','wow','nerd','alien','cat']],['Symbols',['heart','star','fire','thumbs','party','rocket','sun','moon','bolt','cloud','rainbow','flower','ghost']],['Objects',['coffee','music','gift','crown','diamond','skull','robot']]];
  const usedKeys = new Set(STK_CATS.flatMap(c => c[1]));
  const leftover = Object.keys(STICKERS).filter(k => !usedKeys.has(k));
  if(leftover.length) if(leftover.length) STK_CATS.push(['Collection', leftover]);
  stkGrid.innerHTML = STK_CATS.map(([name, keys]) =>
    `<div class="stk-h">${name}</div><div class="stk-grid">${keys.filter(k => STICKERS[k]).map(k => `<button data-stk="${k}">${STICKERS[k]}</button>`).join('')}</div>`
  ).join('');
  const stkPanel = $('#stickerPanel');

    const b = e.target.closest('[data-stk]'); if(!b || !currentChat) return;
    stkPanel.classList.add('hidden');

  showView('chats');
